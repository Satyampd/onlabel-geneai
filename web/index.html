<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <title>OnLabel · Approved answers for KESIMPTA</title>
  <link rel="stylesheet" href="static/theme.css">
  <link rel="stylesheet" href="static/app.css">
</head>
<body>
  <div class="aurora" aria-hidden="true"><span></span></div>

  <!-- ===================== Top bar ===================== -->
  <header class="topbar">
    <a class="logo" href="./" aria-label="OnLabel home">
      <span class="logo__mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.8 4.5 5.6v5.7c0 4.6 3.1 8.6 7.5 9.9 4.4-1.3 7.5-5.3 7.5-9.9V5.6L12 2.8Z"/><path d="m8.6 12.1 2.4 2.4 4.6-4.8"/></svg>
      </span>
      <span class="logo__text">
        <span class="logo__name">OnLabel</span>
        <span class="logo__sub">Approved answers for KESIMPTA</span>
      </span>
    </a>

    <div class="topbar__actions">
      <button type="button" class="switch" id="whyToggle" role="switch" aria-checked="true">
        <span class="switch__track" aria-hidden="true"><span class="switch__thumb"></span></span>
        <span class="switch__label">Details</span>
      </button>
      <button type="button" class="tbtn" id="isiBtn" aria-haspopup="dialog" aria-controls="drawer">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7.5v5.5"/><path d="M12 16.5h.01"/></svg>
        <span class="tbtn__label">Safety information</span>
      </button>
      <button type="button" class="tbtn tbtn--icon" id="newChatBtn" aria-label="New chat" title="New chat">
        <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14"/><path d="M5 12h14"/></svg>
      </button>
    </div>
  </header>

  <!-- ===================== Prototype banner ===================== -->
  <div class="banner" role="note">
    <span id="bannerText"></span>
  </div>

  <!-- ===================== Conversation ===================== -->
  <main class="chat" aria-label="Patient chat">
    <div class="scroller" id="scroller">
      <div class="column">
        <!-- Empty-state hero -->
        <section class="hero" id="hero" aria-labelledby="heroTitle">
          <div class="hero__mesh" aria-hidden="true"></div>
          <p class="hero__eyebrow">KESIMPTA patient information</p>
          <h1 class="hero__title" id="heroTitle">
            <span class="hero__line">Answers you can trust.</span>
          </h1>
          <p class="hero__subtitle">Approved KESIMPTA information, with the page it comes from.</p>
          <div class="starters" id="starters" role="group" aria-label="Suggested questions"></div>
        </section>

        <!-- Message list -->
        <div class="messages" id="messages" aria-live="polite" aria-relevant="additions" aria-label="Conversation"></div>
      </div>
    </div>

    <!-- Composer -->
    <div class="composer">
      <form class="composer__form" id="composerForm" autocomplete="off">
        <label for="input" class="sr-only">Your question</label>
        <input id="input" class="composer__input" type="text" maxlength="1000"
               placeholder="Ask a question about KESIMPTA" enterkeyhint="send">
        <button type="submit" class="composer__send" id="sendBtn" aria-label="Send question" disabled>
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5"/><path d="m5 12 7-7 7 7"/></svg>
        </button>
      </form>
      <p class="composer__note">Not a substitute for advice from your healthcare provider.</p>
    </div>
  </main>

  <!-- ===================== Drawer (safety information / source page) ===================== -->
  <div class="backdrop" id="backdrop" hidden></div>
  <aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="drawerTitle" hidden>
    <div class="drawer__handle" aria-hidden="true"></div>
    <div class="drawer__head">
      <div class="drawer__heading">
        <h2 class="drawer__title" id="drawerTitle"></h2>
        <p class="drawer__subtitle" id="drawerSubtitle"></p>
      </div>
      <button type="button" class="drawer__close" id="drawerClose" aria-label="Close panel">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12"/><path d="M18 6 6 18"/></svg>
      </button>
    </div>
    <div class="drawer__body" id="drawerBody"></div>
  </aside>

  <script src="static/app.js"></script>
</body>
</html>
